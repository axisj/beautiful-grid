name: Publish npm Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11

      - name: Validate release tag
        run: |
          set -Eeuo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify library
        run: npm run verify:library

      - name: Build publishable package
        run: npm run build:library

      - name: Select npm distribution tag
        id: dist_tag
        run: |
          set -Eeuo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        run: npm publish ./dist --access public --tag "${{ steps.dist_tag.outputs.name }}"
