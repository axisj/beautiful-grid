name: beautiful-grid

services:
  site:
    image: beautiful-grid-site:${BEAUTIFUL_GRID_IMAGE_TAG:?BEAUTIFUL_GRID_IMAGE_TAG is required}
    platform: linux/amd64
    ports:
      - '127.0.0.1:7195:80'
    networks:
      default:
        aliases:
          - beautiful-grid-site
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--timeout=5', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
    external: true
    name: axstaff_default
